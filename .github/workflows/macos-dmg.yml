name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-macos-x64:
    name: Build macOS x64 DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 x64 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          architecture: x64

      - name: Verify build environment
        run: |
          uname -m
          java -XshowSettings:properties -version 2>&1 | grep os.arch || true
          file "$(which java)"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build launcher-fancy shadow jar
        run: ./gradlew :launcher-fancy:shadowJar --stacktrace

      - name: List built jars
        run: |
          echo "Built jars:"
          find launcher-fancy/build/libs -maxdepth 1 -name "*.jar" -print

      - name: Download Intel Java 17 runtime
        run: |
          mkdir -p build/macos/runtime
          curl -L -o build/macos/java17-x64.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/17/ga/mac/x64/jdk/hotspot/normal/eclipse?project=jdk"
          tar -xzf build/macos/java17-x64.tar.gz -C build/macos/runtime --strip-components=1

      - name: Verify downloaded runtime
        run: |
          file "build/macos/runtime/Contents/Home/bin/java"
          "build/macos/runtime/Contents/Home/bin/java" -XshowSettings:properties -version 2>&1 | grep os.arch || true

      - name: Create macOS app bundle
        run: |
          APP_NAME="NGLauncher"
          APP_DIR="build/macos/${APP_NAME}.app"

          rm -rf "$APP_DIR"

          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          mkdir -p "$APP_DIR/Contents/runtime"

          JAR="$(find launcher-fancy/build/libs -maxdepth 1 -name "*-all.jar" | head -n 1)"

          if [ -z "$JAR" ]; then
            JAR="$(find launcher-fancy/build/libs -maxdepth 1 -name "*.jar" ! -name "*plain*" ! -name "*sources*" ! -name "*javadoc*" | head -n 1)"
          fi

          if [ -z "$JAR" ]; then
            echo "No launcher jar found in launcher-fancy/build/libs"
            exit 1
          fi

          echo "Using launcher jar: $JAR"

          cp "$JAR" "$APP_DIR/Contents/Resources/launcher.jar"
          cp -R build/macos/runtime/* "$APP_DIR/Contents/runtime/"

          cat > "$APP_DIR/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>NGLauncher</string>

              <key>CFBundleDisplayName</key>
              <string>NGLauncher</string>

              <key>CFBundleIdentifier</key>
              <string>de.bloodraid.nglauncher</string>

              <key>CFBundleVersion</key>
              <string>1.0.0</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleExecutable</key>
              <string>NGLauncher</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
          </dict>
          </plist>
          EOF

          cat > "$APP_DIR/Contents/MacOS/NGLauncher" <<'EOF'
          #!/bin/bash
          set -e

          DIR="$(cd "$(dirname "$0")/.." && pwd)"

          JAVA="$DIR/runtime/Contents/Home/bin/java"
          JAR="$DIR/Resources/launcher.jar"

          APP_SUPPORT="$HOME/Library/Application Support/NGLauncher"
          mkdir -p "$APP_SUPPORT"
          cd "$APP_SUPPORT"

          exec "$JAVA" -jar "$JAR"
          EOF

          chmod +x "$APP_DIR/Contents/MacOS/NGLauncher"

      - name: Verify app bundle
        run: |
          test -f "build/macos/NGLauncher.app/Contents/MacOS/NGLauncher"
          test -f "build/macos/NGLauncher.app/Contents/Resources/launcher.jar"
          test -f "build/macos/NGLauncher.app/Contents/runtime/Contents/Home/bin/java"

          file "build/macos/NGLauncher.app/Contents/runtime/Contents/Home/bin/java"
          plutil -lint "build/macos/NGLauncher.app/Contents/Info.plist"

      - name: Ad-hoc sign app
        run: |
          codesign --force --deep --sign - "build/macos/NGLauncher.app"
          codesign --verify --deep --strict --verbose=2 "build/macos/NGLauncher.app"

      - name: Create DMG
        run: |
          mkdir -p build/dist

          hdiutil create \
            -volname "NGLauncher" \
            -srcfolder "build/macos/NGLauncher.app" \
            -ov \
            -format UDZO \
            "build/dist/NGLauncher-macOS-x64.dmg"

      - name: Ad-hoc sign DMG
        run: |
          codesign --force --sign - "build/dist/NGLauncher-macOS-x64.dmg"
          codesign --verify --verbose=2 "build/dist/NGLauncher-macOS-x64.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGLauncher-macOS-x64
          path: build/dist/NGLauncher-macOS-x64.dmg